<!doctype html>
<!-- Cloudflare Pages serves this file with a 404 status. Without it, every unknown path
     returns index.html with a 200 status. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>#REF! - Awal Ariansyah</title>
    <meta name="robots" content="noindex" />
    <link
      rel="preload"
      href="/assets/fonts/geist-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/css/tokens.css" />
    <style>
      body {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        margin: 0;
        padding: var(--space-4);
        color: var(--ink);
        background: var(--paper);
        font-family: var(--font-mono);
        font-size: var(--text-md);
        line-height: 1.65;
      }

      main {
        max-width: 34rem;
        padding: var(--space-8);
        border: var(--rule-bright);
      }

      h1 {
        margin: 0 0 var(--space-2);
        color: var(--accent);
        font-size: 1.25rem;
        font-weight: 600;
      }

      p {
        margin: 0 0 var(--space-4);
      }

      a {
        color: var(--accent);
        text-underline-offset: 0.25em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>#REF!</h1>
      <p>This address points at a cell that does not exist.</p>
      <p lang="id">Alamat ini menunjuk ke sel yang tidak ada.</p>
      <p><a href="/">[ open the spreadsheet ]</a> <a href="/resume">[ read the resume ]</a></p>
    </main>
  </body>
</html>
