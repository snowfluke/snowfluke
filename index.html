    <script>
      // Runs before the first paint, so a saved theme never flashes the other one.
      // It also preloads the text of the active language. Keep the language order in step
      // with detect() in js/i18n.js: URL parameter, saved choice, browser.
      (() => {
        let view = {};
        try {
          view = JSON.parse(localStorage.getItem("snowfluke.sheets.v1"))?.view ?? {};
        } catch {}
        if (view.theme === "light" || view.theme === "dark")
          document.documentElement.dataset.theme = view.theme;
        const languages = ["en", "id"];
        const param = new URLSearchParams(location.search).get("lang");
        const browser = navigator.language?.toLowerCase().startsWith("id") ? "id" : "en";
        const lang = [param, view.lang, browser].find((code) => languages.includes(code));
        const files = [`js/data/content.${lang}.js`];
        if (lang !== "en") files.push(`js/locales/${lang}.js`);
        for (const href of files) {
          document.head.append(
            Object.assign(document.createElement("link"), { rel: "modulepreload", href }),
          );
        }
      })();
    </script>
